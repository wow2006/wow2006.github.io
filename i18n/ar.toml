# Arabic strings: site keys plus Arabic versions of the theme's keys (the theme has no ar.toml).
# U+2068/U+2069 isolate the (left-to-right) file name, so the "(N ...)" after it
# is not pulled into its run and mirrored.
# Plural forms follow CLDR for Arabic: one, two, few (3-10), many (11-99), other.
[codeSummary]
zero  = "عرض الشيفرة{{ with .Name }}: \u2068{{ . }}\u2069{{ end }} ({{ .Count }} سطر)"
one   = "عرض الشيفرة{{ with .Name }}: \u2068{{ . }}\u2069{{ end }} (سطر واحد)"
two   = "عرض الشيفرة{{ with .Name }}: \u2068{{ . }}\u2069{{ end }} (سطران)"
few   = "عرض الشيفرة{{ with .Name }}: \u2068{{ . }}\u2069{{ end }} ({{ .Count }} أسطر)"
many  = "عرض الشيفرة{{ with .Name }}: \u2068{{ . }}\u2069{{ end }} ({{ .Count }} سطرًا)"
other = "عرض الشيفرة{{ with .Name }}: \u2068{{ . }}\u2069{{ end }} ({{ .Count }} سطر)"

# Same label for a titled block; the title and the language name are both isolated.
[codeSummaryTitled]
zero  = "عرض الشيفرة: \u2068{{ .Title }}\u2069 (\u2068{{ .Name }}\u2069، {{ .Count }} سطر)"
one   = "عرض الشيفرة: \u2068{{ .Title }}\u2069 (\u2068{{ .Name }}\u2069، سطر واحد)"
two   = "عرض الشيفرة: \u2068{{ .Title }}\u2069 (\u2068{{ .Name }}\u2069، سطران)"
few   = "عرض الشيفرة: \u2068{{ .Title }}\u2069 (\u2068{{ .Name }}\u2069، {{ .Count }} أسطر)"
many  = "عرض الشيفرة: \u2068{{ .Title }}\u2069 (\u2068{{ .Name }}\u2069، {{ .Count }} سطرًا)"
other = "عرض الشيفرة: \u2068{{ .Title }}\u2069 (\u2068{{ .Name }}\u2069، {{ .Count }} سطر)"

[viewOnGitHub]
other = "عرض على GitHub"

